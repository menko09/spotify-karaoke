<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Spotify Karaoke</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main id="app">
  <nav id="sources" aria-label="Music source">
    <button class="src active" data-src="spotify" aria-pressed="true">Spotify</button>
    <button class="src" data-src="youtube" aria-pressed="false">YouTube</button>
    <button class="src" data-src="audius" aria-pressed="false">Audius</button>
    <button class="src" data-src="files" aria-pressed="false">My files</button>
  </nav>
  <section id="login" class="panel" hidden>
    <h1>Spotify Karaoke</h1>
    <p>Play music in your Spotify app. Synced lyrics show up here.</p>
    <p id="config-warn" class="warn" hidden>Set CLIENT_ID in config.js first (see README).</p>
    <button id="login-btn" class="primary">Log in with Spotify</button>
  </section>

  <section id="player" hidden>
    <header id="top">
      <img id="art" alt="Album art" width="64" height="64">
      <div class="meta">
        <div id="title" class="title">-</div>
        <div id="artist" class="artist"></div>
        <div id="album" class="album"></div>
      </div>
      <span id="state" class="state" role="status" aria-label="Paused">&#10074;&#10074;</span>
      <button id="fs-btn" class="icon" aria-label="Toggle fullscreen">&#9974;</button>
    </header>

    <nav id="tabs" aria-label="Views">
      <button class="tab active" data-view="lyrics" aria-selected="true">Lyrics</button>
      <button class="tab" data-view="browse" aria-selected="false">Browse</button>
      <span class="spacer"></span>
      <button id="prev" class="icon sm" aria-label="Previous song">&#9198;</button>
      <button id="pp" class="icon sm" aria-label="Play or pause">&#9199;</button>
      <button id="next" class="icon sm" aria-label="Next song">&#9197;</button>
    </nav>
    <div id="scope-banner" class="banner" hidden>
      <span>New features need extra Spotify permissions.</span>
      <button id="relogin-btn" class="act">Log in again</button>
    </div>

    <div id="media">
      <div id="yt-wrap" hidden><div id="yt-player"></div></div>
      <audio id="audio" controls preload="none" hidden></audio>
      <div id="media-note" class="banner" role="alert" hidden></div>
    </div>

    <div id="lyrics" aria-live="off"></div>
    <div id="message" class="message" role="status" hidden></div>

    <section id="browse" hidden>
      <nav id="subtabs" aria-label="Browse sections">
        <button class="subtab active" data-sec="search" aria-selected="true">Search</button>
        <button class="subtab" data-sec="playlists" aria-selected="false">Playlists</button>
        <button class="subtab" data-sec="suggest" aria-selected="false">For you</button>
        <button class="subtab" data-sec="queue" aria-selected="false">Up next</button>
      </nav>
      <div id="sec-search" class="sec">
        <form id="search-form" role="search">
          <input id="search-input" type="search" placeholder="Search songs or artists" aria-label="Search songs" autocomplete="off" enterkeyhint="search">
          <button class="act" type="submit">Search</button>
        </form>
        <label class="toggle"><input id="karaoke-toggle" type="checkbox"> Karaoke versions</label>
        <div id="search-results"></div>
      </div>
      <div id="sec-playlists" class="sec" hidden>
        <div id="pl-list-view"><div id="pl-list"></div></div>
        <div id="pl-tracks-view" hidden>
          <div class="subhead"><button id="pl-back" class="act ghost">&#8249; Back</button><h2 id="pl-title"></h2></div>
          <div id="pl-items"></div>
          <button id="pl-more" class="act ghost wide" hidden>Load more</button>
        </div>
      </div>
      <div id="sec-suggest" class="sec" hidden>
        <h2>Your top tracks lately</h2>
        <div id="top-list"></div>
        <h2>Recently played</h2>
        <div id="recent-list"></div>
      </div>
      <div id="sec-queue" class="sec" hidden>
        <div class="subhead"><h2>Up next</h2><button id="queue-refresh" class="act ghost">Refresh</button></div>
        <div id="queue-list"></div>
      </div>
    </section>
    <section id="browse-other" hidden>
      <p id="o-hint" class="note"></p>
      <form id="o-form" role="search">
        <input id="o-input" type="search" aria-label="Search" autocomplete="off" enterkeyhint="search">
        <button class="act" type="submit">Search</button>
      </form>
      <label id="o-karaoke-label" class="toggle"><input id="o-karaoke" type="checkbox"> Karaoke versions</label>
      <div id="o-file-row" hidden>
        <input id="file-input" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav,audio/x-wav" multiple class="visually-hidden">
        <label class="act filebtn" for="file-input">Choose MP3 / WAV files</label>
      </div>
      <div id="o-results"></div>
    </section>
    <div id="toast" class="toast" role="status" hidden></div>

    <form id="edit-box" hidden>
      <input id="edit-artist" placeholder="Artist" aria-label="Artist" autocomplete="off">
      <input id="edit-title" placeholder="Title" aria-label="Title" autocomplete="off" required>
      <button class="act" type="submit">Find lyrics</button>
    </form>

    <footer id="bottom">
      <label for="offset">Timing <output id="offset-val">0.0 s</output></label>
      <input id="offset" type="range" min="-3" max="3" step="0.1" value="0.8">
      <button id="logout-btn" class="link">Log out</button>
      <button id="edit-link" class="link" hidden>Edit artist/title</button>
    </footer>
  </section>
</main>
<script src="config.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
