<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Spotify Karaoke</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="login" class="panel" hidden>
    <h1>Spotify Karaoke</h1>
    <p>Play music in your Spotify app. Synced lyrics show up here.</p>
    <p id="config-warn" class="warn" hidden>Set CLIENT_ID in config.js first (see README).</p>
    <button id="login-btn" class="primary">Log in with Spotify</button>
  </section>

  <section id="player" hidden>
    <header id="top">
      <img id="art" alt="Album art" width="64" height="64">
      <div class="meta">
        <div id="title" class="title">-</div>
        <div id="artist" class="artist"></div>
        <div id="album" class="album"></div>
      </div>
      <span id="state" class="state" role="status" aria-label="Paused">&#10074;&#10074;</span>
      <button id="fs-btn" class="icon" aria-label="Toggle fullscreen">&#9974;</button>
    </header>

    <div id="lyrics" aria-live="off"></div>
    <div id="message" class="message" role="status" hidden></div>

    <footer id="bottom">
      <label for="offset">Timing <output id="offset-val">0.0 s</output></label>
      <input id="offset" type="range" min="-3" max="3" step="0.1" value="0.8">
      <button id="logout-btn" class="link">Log out</button>
    </footer>
  </section>
</main>
<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
